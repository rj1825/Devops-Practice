apiVersion: v1
kind: Namespace
metadata:
  name: chaos-testing
---
# Redis Database Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db
  namespace: chaos-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-db
  template:
    metadata:
      labels:
        app: redis-db
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: chaos-testing
spec:
  ports:
  - port: 6379
  selector:
    app: redis-db
---
# Backend Microservice with Prometheus Metric Endpoint
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: chaos-testing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: rj1825/kanban-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: chaos-testing
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend-app
---
# Frontend App Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: chaos-testing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
      - name: frontend
        image: rj1825/kanban-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_URL
          value: "http://backend-service:8000"
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: chaos-testing
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: frontend-app
