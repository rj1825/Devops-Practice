# Helm configuration values for kube-prometheus-stack
# This installs Prometheus Operator, Prometheus, Alertmanager, and Grafana.

prometheus:
  prometheusSpec:
    # Enable scanning of pods outside the monitoring namespace
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    
    # Configure custom scrapers to automatically find annotated pods
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods-autodetect'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

grafana:
  enabled: true
  adminPassword: admin # Set simple dashboard admin password
  service:
    type: NodePort
    nodePort: 30030 # Expose Grafana on NodePort 30030 for easy local access
  
  persistence:
    enabled: false # Turn off persistent volumes for transient testing
    
  # Enable sidecar dashboards (auto-discovery of dashboards loaded via ConfigMaps)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'null'
    receivers:
    - name: 'null'
