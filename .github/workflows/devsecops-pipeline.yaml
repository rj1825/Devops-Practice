name: Project 9 DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Project 9/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Project 9/**'

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-scan:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'Project 9/app'
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found
          severity: 'CRITICAL,HIGH'

  iac-scan:
    name: Infrastructure as Code (IaC) Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 'Project 9/terraform'
          framework: terraform
          output_format: cli
          soft_fail: false # Fails the build on violation

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Docker Image
        run: |
          docker build -t devsecops-test-app:latest "Project 9/app"

      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-test-app:latest'
          format: 'table'
          exit-code: '1' # Fails the build on high/critical vulns
          severity: 'CRITICAL,HIGH'
