apiVersion: v1
kind: Namespace
metadata:
  name: secure-zone
  annotations:
    # Tell Linkerd service mesh to automatically inject proxies into all pods in this namespace
    linkerd.io/inject: enabled
---
# Hardened Redis Database Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db
  namespace: secure-zone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-db
  template:
    metadata:
      labels:
        app: redis-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: secure-zone
spec:
  ports:
  - port: 6379
  selector:
    app: redis-db
---
# Hardened Backend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: secure-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: kanban-backend:secure
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: secure-zone
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend-app
---
# Hardened Frontend Deployment & Service (Listening on unprivileged port 8080)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: secure-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # Run as non-root nginx user
        fsGroup: 101
      containers:
      - name: frontend
        image: kanban-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # Unprivileged port
        env:
        - name: BACKEND_URL
          value: "http://backend-service:8000"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        # Nginx requires temporary write locations on boot, mapped to emptyDir volumes
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: run-volume
          mountPath: /var/run
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: cache-volume
        emptyDir: {}
      - name: run-volume
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: secure-zone
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 32080 # Expose on NodePort 32080
  selector:
    app: frontend-app
