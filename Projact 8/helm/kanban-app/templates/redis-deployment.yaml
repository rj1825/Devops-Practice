apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: {{ .Values.global.app }}
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.global.app }}
      component: redis
  template:
    metadata:
      labels:
        app: {{ .Values.global.app }}
        component: redis
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.redis.service.port }}
          name: redis
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: {{ .Values.global.app }}
    component: redis
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.redis.service.port }}
    targetPort: {{ .Values.redis.service.port }}
    name: redis
  selector:
    app: {{ .Values.global.app }}
    component: redis
